<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | QuickLocal</title>

    <link rel="stylesheet" href="../Css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">

                <img src="../Images/logo2.png" alt="QuickLocal">

            </div>

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email Address"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required>

                </div>

                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>

            <p class="bottom-text">

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>

        </div>

    </div>

    <script src="../Js/auth.js"></script>

</body>

</html>
