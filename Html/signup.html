<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | QuickLocal</title>

    <link rel="stylesheet" href="../Css/login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">

            <img src="../Images/logo2.png" alt="QuickLocal">

        </div>

        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                id="signupName"
                placeholder="Full Name"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="signupEmail"
                placeholder="Email Address"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="signupConfirmPassword"
                placeholder="Confirm Password"
                required>

            </div>

            <button
            type="submit"
            class="auth-btn">

                Create Account

            </button>

        </form>

        <p class="bottom-text">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

    </div>

</div>

<script src="../Js/auth.js"></script>

</body>
</html>
